<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 424" width="800" height="424"><rect x="0.0" y="0.0" width="800.0" height="424.0" fill="#F5F0E4" stroke="none" stroke-width="1.0"/><rect x="264.0" y="34.0" width="300.0" height="40.0" fill="#EFE9DC" stroke="#1C1712" stroke-width="1.2"/><text x="414.0" y="59.0" text-anchor="middle" font-family="Space Mono, monospace" font-size="11" letter-spacing="2.0" font-weight="700" fill="#1C1712">THE OBJECT IN YOUR HAND</text><line x1="414.0" y1="74.0" x2="414.0" y2="104.0" stroke="#1C1712" stroke-width="1.4"/><rect x="182.0" y="104.0" width="464.0" height="52.0" fill="none" stroke="#A60A14" stroke-width="1.6"/><text x="414.0" y="126.0" text-anchor="middle" font-family="Space Mono, monospace" font-size="10.5" letter-spacing="1.4" font-weight="700" fill="#A60A14">IS IT OF A PREHISTORIC OR HISTORIC PERIOD,</text><text x="414.0" y="144.0" text-anchor="middle" font-family="Space Mono, monospace" font-size="10.5" letter-spacing="1.4" font-weight="700" fill="#A60A14">AND OF CULTURAL OR SCIENTIFIC VALUE?</text><text x="658.0" y="134.0" font-family="Space Mono, monospace" font-size="9" letter-spacing="1.4" fill="#A60A14">NO AGE</text><text x="658.0" y="148.0" font-family="Space Mono, monospace" font-size="9" letter-spacing="1.4" fill="#A60A14">IS STATED</text><line x1="414.0" y1="156.0" x2="414.0" y2="178.0" stroke="#1C1712" stroke-width="1.2"/><line x1="184.0" y1="178.0" x2="644.0" y2="178.0" stroke="#1C1712" stroke-width="1.2"/><line x1="184.0" y1="178.0" x2="184.0" y2="200.0" stroke="#1C1712" stroke-width="1.2"/><line x1="644.0" y1="178.0" x2="644.0" y2="200.0" stroke="#1C1712" stroke-width="1.2"/><rect x="54.0" y="200.0" width="260.0" height="40.0" fill="none" stroke="#A60A14" stroke-width="1.4"/><text x="184.0" y="225.0" text-anchor="middle" font-family="Space Mono, monospace" font-size="10.5" letter-spacing="1.8" font-weight="700" fill="#A60A14">YES — PROTECTED</text><text x="54.0" y="264.0" font-family="Space Mono, monospace" font-size="9.5" letter-spacing="0.3" fill="#2A241D">Export prohibited in principle (Art. 32).</text><text x="54.0" y="281.0" font-family="Space Mono, monospace" font-size="9.5" letter-spacing="0.3" fill="#2A241D">Only a state museum's classification decides.</text><text x="54.0" y="298.0" font-family="Space Mono, monospace" font-size="9.5" letter-spacing="0.3" fill="#2A241D">A vendor's certificate has no legal force.</text><text x="54.0" y="315.0" font-family="Space Mono, monospace" font-size="9.5" letter-spacing="0.3" fill="#2A241D">Unauthorised export: 5 to 12 years.</text><rect x="514.0" y="200.0" width="260.0" height="40.0" fill="none" stroke="#1C1712" stroke-width="1.4"/><text x="644.0" y="225.0" text-anchor="middle" font-family="Space Mono, monospace" font-size="10.5" letter-spacing="1.8" font-weight="700" fill="#1C1712">NO — ORDINARY GOODS</text><text x="514.0" y="264.0" font-family="Space Mono, monospace" font-size="9.5" letter-spacing="0.3" fill="#2A241D">Leaves with you; declare it regardless.</text><text x="514.0" y="281.0" font-family="Space Mono, monospace" font-size="9.5" letter-spacing="0.3" fill="#2A241D">$800 US personal exemption, 48h abroad.</text><text x="514.0" y="298.0" font-family="Space Mono, monospace" font-size="9.5" letter-spacing="0.3" fill="#2A241D">A receipt proves price, never permission.</text><text x="514.0" y="315.0" font-family="Space Mono, monospace" font-size="9.5" letter-spacing="0.3" fill="#2A241D">US bars archaeological material to 2031.</text><line x1="92.0" y1="370.0" x2="736.0" y2="370.0" stroke="#E7E1D3" stroke-width="1"/><text x="414.0" y="390.0" text-anchor="middle" font-family="Gelasio, Georgia, serif" font-size="11" font-style="italic" fill="#1C1712">The traveller looks for the age that separates the two boxes. Turkish law states none.</text><text x="92.0" y="412.0" font-family="Space Mono, monospace" font-size="8" letter-spacing="1.6" fill="#6E665A">SOURCE: LAW 2863 ARTICLES 3, 23, 25, 32 · US CULTURAL PROPERTY RESTRICTION</text></svg>