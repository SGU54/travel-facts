<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 392" width="800" height="392"><rect x="0.0" y="0.0" width="800.0" height="392.0" fill="#F5F0E4" stroke="none" stroke-width="1.0"/><text x="92.0" y="44.0" font-family="Space Mono, monospace" font-size="10.5" letter-spacing="1.8" font-weight="700" fill="#1C1712">A CARD IS REFUSED IN A SHOP. WHERE WAS THAT DECIDED?</text><rect x="92.0" y="70.0" width="536.7" height="30.0" fill="#A60A14" stroke="#1C1712" stroke-width="1" opacity="0.9"/><text x="360.3" y="90.0" text-anchor="middle" font-family="Space Mono, monospace" font-size="12" font-weight="700" fill="#F5F0E4">5</text><rect x="628.7" y="70.0" width="107.3" height="30.0" fill="#E5DDCC" stroke="#1C1712" stroke-width="1" opacity="1"/><text x="682.3" y="90.0" text-anchor="middle" font-family="Space Mono, monospace" font-size="12" font-weight="700" fill="#1C1712">1</text><text x="92.0" y="122.0" font-family="Space Mono, monospace" font-size="9" letter-spacing="1.6" fill="#6E665A">TERMINAL 0  ·  MERCHANT 0  ·  YOUR OWN BANK 5  ·  NETWORK 1</text><line x1="92.0" y1="138.0" x2="736.0" y2="138.0" stroke="#E7E1D3" stroke-width="1"/><text x="92.0" y="170.0" font-family="Space Mono, monospace" font-size="10.5" letter-spacing="1.8" font-weight="700" fill="#1C1712">AND WHICH CHANNEL CARRIES THE REMEDY</text><text x="92.0" y="198.0" font-family="Space Mono, monospace" font-size="10" letter-spacing="0.4" fill="#2A241D">A verification code</text><text x="736.0" y="198.0" text-anchor="end" font-family="Space Mono, monospace" font-size="9.5" letter-spacing="1.6" font-weight="700" fill="#A60A14">TEXT</text><line x1="92.0" y1="207.0" x2="736.0" y2="207.0" stroke="#E7E1D3" stroke-width="0.8"/><text x="92.0" y="228.0" font-family="Space Mono, monospace" font-size="10" letter-spacing="0.4" fill="#2A241D">A call-back to release a hold</text><text x="736.0" y="228.0" text-anchor="end" font-family="Space Mono, monospace" font-size="9.5" letter-spacing="1.6" font-weight="700" fill="#A60A14">VOICE</text><line x1="92.0" y1="237.0" x2="736.0" y2="237.0" stroke="#E7E1D3" stroke-width="0.8"/><text x="92.0" y="258.0" font-family="Space Mono, monospace" font-size="10" letter-spacing="0.4" fill="#2A241D">Raising a daily limit</text><text x="736.0" y="258.0" text-anchor="end" font-family="Space Mono, monospace" font-size="9.5" letter-spacing="1.6" font-weight="700" fill="#A60A14">VOICE OR APP</text><line x1="92.0" y1="267.0" x2="736.0" y2="267.0" stroke="#E7E1D3" stroke-width="0.8"/><text x="92.0" y="288.0" font-family="Space Mono, monospace" font-size="10" letter-spacing="0.4" fill="#2A241D">Enabling international use</text><text x="736.0" y="288.0" text-anchor="end" font-family="Space Mono, monospace" font-size="9.5" letter-spacing="1.6" font-weight="700" fill="#1C1712">APP, OVER DATA</text><line x1="92.0" y1="297.0" x2="736.0" y2="297.0" stroke="#E7E1D3" stroke-width="0.8"/><text x="92.0" y="338.0" font-family="Gelasio, Georgia, serif" font-size="11" font-style="italic" fill="#1C1712">Three of the four need the number you turned off at the airport.</text><line x1="92.0" y1="362.0" x2="736.0" y2="362.0" stroke="#E7E1D3" stroke-width="1"/><text x="92.0" y="380.0" font-family="Space Mono, monospace" font-size="8" letter-spacing="1.6" fill="#6E665A">SOURCE: THE ORDINARY REFUSAL CAUSES · ISSUER RULES ARE NOT PUBLISHED</text></svg>