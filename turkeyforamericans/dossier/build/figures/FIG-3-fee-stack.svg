<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392">
<rect width="760" height="392" fill="#FAF6EE"/>
<text x="60" y="44" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="1.4" fill="#8A8175">ONE WITHDRAWAL · FOUR LAYERS</text>
<rect x="60" y="72" width="450" height="46" fill="#E4121F" opacity="0.13"/>
<rect x="60" y="72" width="5" height="46" fill="#E4121F"/>
<text x="80" y="92" font-family="Archivo,sans-serif" font-size="13" font-weight="600" fill="#15110D">Turkish operator fee</text>
<text x="80" y="108" font-family="Archivo,sans-serif" font-size="10.5" fill="#8A8175">the machine's bank</text>
<text x="530" y="99" font-family="IBM Plex Mono,monospace" font-size="10" fill="#E4121F">scales with the amount</text>
<rect x="60" y="128" width="450" height="46" fill="#15110D" opacity="0.13"/>
<rect x="60" y="128" width="5" height="46" fill="#15110D"/>
<text x="80" y="148" font-family="Archivo,sans-serif" font-size="13" font-weight="600" fill="#15110D">Your issuer's fee</text>
<text x="80" y="164" font-family="Archivo,sans-serif" font-size="10.5" fill="#8A8175">your bank</text>
<text x="530" y="155" font-family="IBM Plex Mono,monospace" font-size="10" fill="#15110D">depends on your issuer</text>
<rect x="60" y="184" width="450" height="46" fill="#E0A24A" opacity="0.13"/>
<rect x="60" y="184" width="5" height="46" fill="#E0A24A"/>
<text x="80" y="204" font-family="Archivo,sans-serif" font-size="13" font-weight="600" fill="#15110D">Exchange margin</text>
<text x="80" y="220" font-family="Archivo,sans-serif" font-size="10.5" fill="#8A8175">network + issuer, inside the rate</text>
<text x="530" y="211" font-family="IBM Plex Mono,monospace" font-size="10" fill="#E0A24A">scales with the amount</text>
<rect x="60" y="240" width="450" height="46" fill="#8A8175" opacity="0.13"/>
<rect x="60" y="240" width="5" height="46" fill="#8A8175"/>
<text x="80" y="260" font-family="Archivo,sans-serif" font-size="13" font-weight="600" fill="#15110D">Dynamic currency conversion</text>
<text x="80" y="276" font-family="Archivo,sans-serif" font-size="10.5" fill="#8A8175">the terminal's provider — only if accepted</text>
<text x="530" y="267" font-family="IBM Plex Mono,monospace" font-size="10" fill="#8A8175">scales with the amount</text>
<line x1="60" y1="302" x2="700" y2="302" stroke="#DCD4C4" stroke-width="1"/>
<text x="60" y="326" font-family="Archivo,sans-serif" font-size="11.5" fill="#15110D">Only one of the four changes at the moment of withdrawal — and it is the machine, not the amount.</text>
<text x="60" y="352" font-family="IBM Plex Mono,monospace" font-size="9" fill="#8A8175">NO FIGURES SHOWN · TARIFFS ARE PER BANK AND LIVE ON THE FIELD SHEET</text>
</svg>