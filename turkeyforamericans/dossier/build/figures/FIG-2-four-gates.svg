<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 824 330" width="824" height="330">
<rect width="824" height="330" fill="#FAF6EE"/>
<line x1="141" y1="58" x2="141" y2="92" stroke="#15110D" stroke-width="1.6"/>
<text x="141" y="40" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="1" fill="#15110D" text-anchor="middle">TURKISH LAW</text>
<text x="141" y="124" font-family="Archivo,sans-serif" font-size="11.5" fill="#15110D" text-anchor="middle">a foreign licence</text>
<text x="141" y="141" font-family="Archivo,sans-serif" font-size="11.5" fill="#15110D" text-anchor="middle">six months from entry</text>
<text x="141" y="196" font-family="IBM Plex Mono,monospace" font-size="9.5" fill="#8A8175" text-anchor="middle">published</text>
<text x="141" y="236" font-family="Archivo,sans-serif" font-size="10.5" fill="#8A8175" text-anchor="middle">lookup-able</text>
<line x1="231" y1="44" x2="231" y2="74" stroke="#DCD4C4" stroke-width="1"/>
