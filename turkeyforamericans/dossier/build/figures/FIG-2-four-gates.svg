<line x1="322" y1="58" x2="322" y2="92" stroke="#E4121F" stroke-width="3.4" stroke-dasharray="6 4"/>
<text x="322" y="40" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="1" fill="#15110D" text-anchor="middle">THE RENTAL DESK</text>
<text x="322" y="124" font-family="Archivo,sans-serif" font-size="11.5" fill="#15110D" text-anchor="middle">whatever the contract</text>
<text x="322" y="141" font-family="Archivo,sans-serif" font-size="11.5" fill="#15110D" text-anchor="middle">says: age, holding</text>
<text x="322" y="158" font-family="Archivo,sans-serif" font-size="11.5" fill="#15110D" text-anchor="middle">period, card</text>
<text x="322" y="196" font-family="IBM Plex Mono,monospace" font-size="9.5" fill="#E4121F" text-anchor="middle">contractual</text>
<text x="322" y="230" font-family="Archivo,sans-serif" font-size="10.5" font-weight="700" fill="#E4121F" text-anchor="middle">NOT PUBLISHED</text>
<text x="322" y="245" font-family="Archivo,sans-serif" font-size="10.5" font-weight="700" fill="#E4121F" text-anchor="middle">IN ADVANCE</text>
<line x1="412" y1="44" x2="412" y2="74" stroke="#DCD4C4" stroke-width="1"/>
<line x1="412" y1="250" x2="412" y2="272" stroke="#DCD4C4" stroke-width="1"/>
<line x1="503" y1="58" x2="503" y2="92" stroke="#15110D" stroke-width="1.6"/>
<text x="503" y="40" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="1" fill="#15110D" text-anchor="middle">YOUR INSURER</text>
<text x="503" y="124" font-family="Archivo,sans-serif" font-size="11.5" fill="#15110D" text-anchor="middle">a licence valid for</text>
<text x="503" y="141" font-family="Archivo,sans-serif" font-size="11.5" fill="#15110D" text-anchor="middle">the vehicle class</text>
<text x="503" y="196" font-family="IBM Plex Mono,monospace" font-size="9.5" fill="#8A8175" text-anchor="middle">your policy</text>
<text x="503" y="236" font-family="Archivo,sans-serif" font-size="10.5" fill="#8A8175" text-anchor="middle">lookup-able</text>
<line x1="594" y1="44" x2="594" y2="74" stroke="#DCD4C4" stroke-width="1"/>
<line x1="594" y1="250" x2="594" y2="272" stroke="#DCD4C4" stroke-width="1"/>
<line x1="684" y1="58" x2="684" y2="92" stroke="#15110D" stroke-width="1.6"/>
<text x="684" y="40" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="1" fill="#15110D" text-anchor="middle">THE ROADSIDE</text>
<text x="684" y="124" font-family="Archivo,sans-serif" font-size="11.5" fill="#15110D" text-anchor="middle">a document an</text>
<text x="684" y="141" font-family="Archivo,sans-serif" font-size="11.5" fill="#15110D" text-anchor="middle">officer can read</text>
<text x="684" y="196" font-family="IBM Plex Mono,monospace" font-size="9.5" fill="#8A8175" text-anchor="middle">the IDP's function</text>
<text x="684" y="236" font-family="Archivo,sans-serif" font-size="10.5" fill="#8A8175" text-anchor="middle">lookup-able</text>
<text x="50" y="308" font-family="IBM Plex Mono,monospace" font-size="9" fill="#8A8175">FOUR PARTIES · FOUR REQUIREMENTS · ONE DOCUMENT SATISFIES THEM OR IT DOES NOT</text>
