<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 396" width="800" height="396"><rect x="0.0" y="0.0" width="800.0" height="396.0" fill="#F5F0E4" stroke="none" stroke-width="1.0"/><text x="92.0" y="70.0" font-family="Space Mono, monospace" font-size="10" letter-spacing="2.4" font-weight="700" fill="#A60A14">ONE TICKET</text><text x="214.0" y="70.0" font-family="Space Mono, monospace" font-size="9.5" letter-spacing="0.6" fill="#6E665A">the carrier chose the gap, and underwrites it</text><rect x="92.0" y="96.0" width="644.0" height="34.0" fill="#EFE9DC" stroke="#E7E1D3" stroke-width="1"/><text x="106.0" y="118.0" font-family="Space Mono, monospace" font-size="10" letter-spacing="1.4" fill="#1C1712">ARRIVE</text><text x="414.0" y="118.0" text-anchor="middle" font-family="Space Mono, monospace" font-size="10" letter-spacing="1.4" fill="#1C1712">CARRIER'S OWN MINIMUM APPLIES</text><text x="722.0" y="118.0" text-anchor="end" font-family="Space Mono, monospace" font-size="10" letter-spacing="1.4" fill="#1C1712">DEPART</text><text x="92.0" y="152.0" font-family="Gelasio, Georgia, serif" font-size="11" fill="#2A241D">Miss it and the carrier re-routes or refunds — its rule, its risk.</text><text x="92.0" y="176.0" font-family="Space Mono, monospace" font-size="10" letter-spacing="2.4" font-weight="700" fill="#A60A14">SEPARATE TICKETS</text><text x="300.0" y="176.0" font-family="Space Mono, monospace" font-size="9.5" letter-spacing="0.6" fill="#6E665A">nobody has chosen the gap</text><rect x="92.0" y="228.0" width="107.3" height="34.0" fill="none" stroke="#E7E1D3" stroke-width="1"/><text x="145.7" y="250.0" text-anchor="middle" font-family="Space Mono, monospace" font-size="8.5" letter-spacing="0.8" fill="#1C1712">ARRIVE</text><rect x="199.3" y="228.0" width="107.3" height="34.0" fill="none" stroke="#E7E1D3" stroke-width="1"/><text x="253.0" y="250.0" text-anchor="middle" font-family="Space Mono, monospace" font-size="8.5" letter-spacing="0.8" fill="#1C1712">PASSPORT</text><rect x="306.7" y="228.0" width="107.3" height="34.0" fill="none" stroke="#E7E1D3" stroke-width="1"/><text x="360.3" y="250.0" text-anchor="middle" font-family="Space Mono, monospace" font-size="8.5" letter-spacing="0.8" fill="#1C1712">RECLAIM BAG</text><rect x="414.0" y="228.0" width="107.3" height="34.0" fill="none" stroke="#E7E1D3" stroke-width="1"/><text x="467.7" y="250.0" text-anchor="middle" font-family="Space Mono, monospace" font-size="8.5" letter-spacing="0.8" fill="#1C1712">RE-CHECK</text><rect x="521.3" y="228.0" width="107.3" height="34.0" fill="none" stroke="#E7E1D3" stroke-width="1"/><text x="575.0" y="250.0" text-anchor="middle" font-family="Space Mono, monospace" font-size="8.5" letter-spacing="0.8" fill="#1C1712">SECURITY</text><rect x="628.7" y="228.0" width="107.3" height="34.0" fill="none" stroke="#E7E1D3" stroke-width="1"/><text x="682.3" y="250.0" text-anchor="middle" font-family="Space Mono, monospace" font-size="8.5" letter-spacing="0.8" fill="#1C1712">DEPART</text><rect x="92.0" y="228.0" width="644.0" height="34.0" fill="none" stroke="#1C1712" stroke-width="1.2"/><line x1="92.0" y1="216.0" x2="736.0" y2="216.0" stroke="#A60A14" stroke-width="2.2"/><line x1="92.0" y1="216.0" x2="92.0" y2="224.0" stroke="#A60A14" stroke-width="2.2"/><line x1="736.0" y1="216.0" x2="736.0" y2="224.0" stroke="#A60A14" stroke-width="2.2"/><text x="414.0" y="207.0" text-anchor="middle" font-family="Space Mono, monospace" font-size="11" letter-spacing="2.0" font-weight="700" fill="#A60A14">HOW LONG DOES THIS NEED TO BE?</text><text x="92.0" y="290.0" font-family="Gelasio, Georgia, serif" font-size="11" fill="#2A241D">No published minimum connection time exists at Istanbul Airport,</text><text x="92.0" y="308.0" font-family="Gelasio, Georgia, serif" font-size="11" fill="#2A241D">and none at Sabiha Gökçen — for any connection type, in either direction.</text><text x="92.0" y="332.0" font-family="Gelasio, Georgia, serif" font-size="11" font-style="italic" fill="#1C1712">The figures in circulation trace back to neither airport operator nor the regulator.</text><line x1="92.0" y1="362.0" x2="736.0" y2="362.0" stroke="#E7E1D3" stroke-width="1"/><text x="92.0" y="380.0" font-family="Space Mono, monospace" font-size="8" letter-spacing="1.6" fill="#6E665A">SOURCE: SHY-YOLCU · BOTH AIRPORT OPERATORS PUBLISH NO FIGURE</text></svg>