<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 652 300" width="652" height="300">
<rect width="652" height="300" fill="#F7F1E4"/>
<text x="0.0" y="16.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="11.5" fill="#6B5F66">Four layers, and the bookable ones are the weakest.</text>
<text x="0.0" y="64.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="12.5" font-weight="600" fill="#241A21">The hotel restaurant</text>
<text x="0.0" y="80.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="9.5" fill="#6B5F66">bookable from home</text>
<rect x="250.0" y="52.0" width="332.0" height="9.0" fill="#6B5F66" opacity="0.55"/>
<rect x="250.0" y="65.0" width="83.0" height="9.0" fill="#D81264" opacity="0.85"/>
<text x="0.0" y="108.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="12.5" font-weight="600" fill="#241A21">The tourist-strip kitchen</text>
<text x="0.0" y="124.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="9.5" fill="#6B5F66">bookable, and priced for it</text>
<rect x="250.0" y="96.0" width="282.2" height="9.0" fill="#6B5F66" opacity="0.55"/>
<rect x="250.0" y="109.0" width="116.2" height="9.0" fill="#D81264" opacity="0.85"/>
<text x="0.0" y="152.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="12.5" font-weight="600" fill="#241A21">The shophouse</text>
<text x="0.0" y="168.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="9.5" fill="#6B5F66">walk in, one page of menu</text>
<rect x="250.0" y="140.0" width="83.0" height="9.0" fill="#6B5F66" opacity="0.55"/>
<rect x="250.0" y="153.0" width="265.6" height="9.0" fill="#D81264" opacity="0.85"/>
<text x="0.0" y="196.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="12.5" font-weight="600" fill="#241A21">The stall</text>
<text x="0.0" y="212.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="9.5" fill="#6B5F66">no booking exists to make</text>
<rect x="250.0" y="184.0" width="0.0" height="9.0" fill="#6B5F66" opacity="0.55"/>
<rect x="250.0" y="197.0" width="332.0" height="9.0" fill="#D81264" opacity="0.85"/>
<line x1="0.0" y1="228.0" x2="652.0" y2="228.0" stroke="#DCCFC0" stroke-width="1"/>
<rect x="250.0" y="242.0" width="14.0" height="8.0" fill="#6B5F66" opacity="0.55"/>
<text x="270.0" y="250.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="9.5" fill="#6B5F66">how bookable</text>
<rect x="370.0" y="242.0" width="14.0" height="8.0" fill="#D81264" opacity="0.85"/>
<text x="390.0" y="250.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="9.5" fill="#6B5F66">how good</text>
<text x="0.0" y="276.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="11.5" fill="#9C0C48">The two bars run opposite. Any plan built on reservations selects the top two rows.</text>
</svg>
