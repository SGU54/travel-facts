<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 652 284" width="652" height="284">
<rect width="652" height="284" fill="#F7F1E4"/>
<text x="0.0" y="16.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="11.5" fill="#6B5F66">What people insure for, against what actually costs.</text>
<text x="130.0" y="44.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="9" letter-spacing="0.8" fill="#6B5F66">CHEAP</text>
<text x="612.0" y="44.0" text-anchor="end" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="9" letter-spacing="0.8" fill="#6B5F66">RUINOUS</text>
<line x1="130.0" y1="62.0" x2="612.0" y2="62.0" stroke="#241A21" stroke-width="1.2"/>
<line x1="130.0" y1="102.0" x2="149.3" y2="102.0" stroke="#6B5F66" stroke-width="1.6"/>
<circle cx="149.3" cy="102.0" r="5" fill="#6B5F66"/>
<text x="0.0" y="106.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="12.5" font-weight="600" fill="#241A21">A stolen phone</text>
<text x="612.0" y="92.0" text-anchor="end" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="9.5" fill="#6B5F66">what the policy is bought for</text>
<line x1="130.0" y1="136.0" x2="187.8" y2="136.0" stroke="#6B5F66" stroke-width="1.6"/>
<circle cx="187.8" cy="136.0" r="5" fill="#6B5F66"/>
<text x="0.0" y="140.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="12.5" font-weight="600" fill="#241A21">A clinic visit</text>
<text x="612.0" y="126.0" text-anchor="end" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="9.5" fill="#6B5F66">paid at the desk, reclaimed later</text>
<line x1="130.0" y1="170.0" x2="313.2" y2="170.0" stroke="#D81264" stroke-width="1.6"/>
<circle cx="313.2" cy="170.0" r="5" fill="#D81264"/>
<text x="0.0" y="174.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="12.5" font-weight="600" fill="#241A21">A night in hospital</text>
<text x="612.0" y="160.0" text-anchor="end" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="9.5" fill="#6B5F66">paid before discharge</text>
<line x1="130.0" y1="204.0" x2="587.9" y2="204.0" stroke="#D81264" stroke-width="1.6"/>
<circle cx="587.9" cy="204.0" r="5" fill="#D81264"/>
<text x="0.0" y="208.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="12.5" font-weight="600" fill="#241A21">Air evacuation</text>
<text x="612.0" y="194.0" text-anchor="end" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="9.5" fill="#6B5F66">the line item the policy exists for</text>
<line x1="0.0" y1="240.0" x2="652.0" y2="240.0" stroke="#DCCFC0" stroke-width="1"/>
<text x="0.0" y="260.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="11.5" fill="#9C0C48">Only the bottom two are worth a policy, and only one of them is why you read the exclusions.</text>
</svg>
