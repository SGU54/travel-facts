<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 652 238" width="652" height="238">
<rect width="652" height="238" fill="#F7F1E4"/>
<text x="0.0" y="16.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="11.5" fill="#6B5F66">One is checked at a door. The other is never checked.</text>
<text x="0.0" y="52.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="13" font-weight="600" fill="#241A21">The temple door</text>
<rect x="0.0" y="64.0" width="250.0" height="96.0" fill="#EFE5D2"/>
<line x1="125.0" y1="64.0" x2="125.0" y2="160.0" stroke="#DCCFC0" stroke-width="1"/>
<text x="62.0" y="88.0" text-anchor="middle" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="9" letter-spacing="0.8" fill="#9C0C48">ADMITTED</text>
<text x="188.0" y="88.0" text-anchor="middle" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="9" letter-spacing="0.8" fill="#D81264">TURNED AWAY</text>
<text x="62.0" y="114.0" text-anchor="middle" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="11" fill="#241A21">shoulders</text>
<text x="62.0" y="130.0" text-anchor="middle" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="11" fill="#241A21">and knees covered</text>
<text x="188.0" y="114.0" text-anchor="middle" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="11" fill="#241A21">anything less,</text>
<text x="188.0" y="130.0" text-anchor="middle" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="11" fill="#241A21">at the busy sites</text>
<text x="0.0" y="180.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="10.5" fill="#6B5F66">Binary, and settled before you arrive.</text>
<text x="300.0" y="52.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="13" font-weight="600" fill="#241A21">The elephant venue</text>
<line x1="300.0" y1="104.0" x2="634.0" y2="104.0" stroke="#241A21" stroke-width="1.2"/>
<circle cx="300.0" cy="104.0" r="4.5" fill="#D81264"/>
<text x="300.0" y="92.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="10" fill="#D81264">riding</text>
<circle cx="450.3" cy="104.0" r="4.5" fill="#6B5F66"/>
<text x="450.3" y="92.0" text-anchor="middle" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="10" fill="#6B5F66">bathing</text>
<circle cx="634.0" cy="104.0" r="4.5" fill="#9C0C48"/>
<text x="634.0" y="92.0" text-anchor="end" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="10" fill="#9C0C48">observation only</text>
<text x="300.0" y="130.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="10.5" fill="#6B5F66">No door, no check, and every venue calls itself</text>
<text x="300.0" y="144.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="10.5" fill="#6B5F66">a sanctuary. The word carries no standard.</text>
<text x="300.0" y="180.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="10.5" fill="#6B5F66">A spectrum, and it is yours to place yourself on.</text>
<line x1="0.0" y1="200.0" x2="652.0" y2="200.0" stroke="#DCCFC0" stroke-width="1"/>
<text x="0.0" y="222.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="11.5" fill="#9C0C48">Confusing the two is the error: people dress for the temple and improvise the elephant.</text>
</svg>
