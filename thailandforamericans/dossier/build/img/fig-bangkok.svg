<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 652 240" width="652" height="240">
<rect width="652" height="240" fill="#F7F1E4"/>
<text x="0.0" y="16.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="11.5" fill="#6B5F66">Where you sleep is a rail question, not a map question.</text>
<rect x="150.0" y="48.0" width="392.0" height="128.0" fill="none" stroke="#DCCFC0" stroke-width="1"/>
<line x1="346.0" y1="48.0" x2="346.0" y2="176.0" stroke="#DCCFC0" stroke-width="1"/>
<line x1="150.0" y1="112.0" x2="542.0" y2="112.0" stroke="#DCCFC0" stroke-width="1"/>
<rect x="150.0" y="48.0" width="196.0" height="64.0" fill="#EFE5D2" opacity="0.85"/>
<text x="346.0" y="36.0" text-anchor="middle" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="9" letter-spacing="0.8" fill="#6B5F66">ON THE BTS OR MRT</text>
<text x="346.0" y="198.0" text-anchor="middle" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="9" letter-spacing="0.8" fill="#6B5F66">OFF THE LINE</text>
<text x="138.0" y="62.0" text-anchor="end" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="9" letter-spacing="0.8" fill="#6B5F66">LOOKS CENTRAL</text>
<text x="138.0" y="170.0" text-anchor="end" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="9" letter-spacing="0.8" fill="#6B5F66">LOOKS FAR</text>
<circle cx="251.9" cy="83.8" r="5" fill="#9C0C48"/>
<text x="251.9" y="73.8" text-anchor="middle" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="10.5" font-weight="600" fill="#241A21">Sukhumvit / Silom</text>
<text x="251.9" y="99.8" text-anchor="middle" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="8.5" fill="#6B5F66">central and on the line</text>
<circle cx="440.1" cy="86.4" r="5" fill="#D81264"/>
<text x="440.1" y="76.4" text-anchor="middle" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="10.5" font-weight="600" fill="#241A21">Riverside</text>
<text x="440.1" y="102.4" text-anchor="middle" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="8.5" fill="#6B5F66">central, and a boat or a jam away</text>
<circle cx="251.9" cy="142.7" r="5" fill="#9C0C48"/>
<text x="251.9" y="132.7" text-anchor="middle" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="10.5" font-weight="600" fill="#241A21">Ari / Phaya Thai</text>
<text x="251.9" y="158.7" text-anchor="middle" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="8.5" fill="#6B5F66">further out, and quicker</text>
<circle cx="440.1" cy="147.8" r="5" fill="#D81264"/>
<text x="440.1" y="137.8" text-anchor="middle" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="10.5" font-weight="600" fill="#241A21">Khao San</text>
<text x="440.1" y="163.8" text-anchor="middle" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="8.5" fill="#6B5F66">neither</text>
<line x1="0.0" y1="218.0" x2="652.0" y2="218.0" stroke="#DCCFC0" stroke-width="1"/>
<text x="0.0" y="230.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="11.5" fill="#9C0C48">The top-left quadrant is the whole answer; the rest is a taxi sitting still.</text>
</svg>
