<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 652 292" width="652" height="292">
<rect width="652" height="292" fill="#F7F1E4"/>
<text x="0.0" y="16.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="11.5" fill="#6B5F66">Four gates. The car clears them; the scooter clears two.</text>
<text x="150.0" y="56.0" text-anchor="middle" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="9" letter-spacing="0.8" fill="#6B5F66">HOME LICENCE</text>
<text x="250.0" y="56.0" text-anchor="middle" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="9" letter-spacing="0.8" fill="#6B5F66">IDP 1949</text>
<text x="370.0" y="56.0" text-anchor="middle" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="9" letter-spacing="0.8" fill="#6B5F66">MOTORCYCLE</text>
<text x="370.0" y="68.0" text-anchor="middle" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="9" letter-spacing="0.8" fill="#6B5F66">ENDORSEMENT</text>
<text x="520.0" y="56.0" text-anchor="middle" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="9" letter-spacing="0.8" fill="#6B5F66">INSURER PAYS</text>
<line x1="0.0" y1="82.0" x2="652.0" y2="82.0" stroke="#241A21" stroke-width="1.4"/>
<text x="0.0" y="118.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="15" font-weight="600" fill="#241A21">Car</text>
<path d="M 146.0 114.0 L 149.0 117.5 L 155.0 110.0" fill="none" stroke="#9C0C48" stroke-width="2" stroke-linecap="round"/>
<path d="M 246.0 114.0 L 249.0 117.5 L 255.0 110.0" fill="none" stroke="#9C0C48" stroke-width="2" stroke-linecap="round"/>
<text x="370.0" y="118.0" text-anchor="middle" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="9.5" fill="#6B5F66">n/a</text>
<path d="M 516.0 114.0 L 519.0 117.5 L 525.0 110.0" fill="none" stroke="#9C0C48" stroke-width="2" stroke-linecap="round"/>
<text x="0.0" y="138.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="11" fill="#6B5F66">the ordinary licence you already hold</text>
<line x1="0.0" y1="152.0" x2="652.0" y2="152.0" stroke="#DCCFC0" stroke-width="1"/>
<text x="0.0" y="180.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="15" font-weight="600" fill="#241A21">Scooter</text>
<path d="M 146.0 176.0 L 149.0 179.5 L 155.0 172.0" fill="none" stroke="#9C0C48" stroke-width="2" stroke-linecap="round"/>
<path d="M 246.0 176.0 L 249.0 179.5 L 255.0 172.0" fill="none" stroke="#9C0C48" stroke-width="2" stroke-linecap="round"/>
<path d="M 366.0 172.0 L 374.0 180.0 M 374.0 172.0 L 366.0 180.0" fill="none" stroke="#D81264" stroke-width="2" stroke-linecap="round"/>
<path d="M 516.0 172.0 L 524.0 180.0 M 524.0 172.0 L 516.0 180.0" fill="none" stroke="#D81264" stroke-width="2" stroke-linecap="round"/>
<text x="0.0" y="200.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="11" fill="#6B5F66">and the endorsement is the gate the insurer reads</text>
<line x1="0.0" y1="214.0" x2="652.0" y2="214.0" stroke="#DCCFC0" stroke-width="1"/>
<text x="0.0" y="252.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="11.5" fill="#9C0C48">The third gate is the whole decision: without the endorsement the ride is uninsured,</text>
<text x="0.0" y="268.0" font-family="'Archivo','Helvetica Neue',sans-serif" font-size="11.5" fill="#9C0C48">not merely unlicensed — and that is a hospital bill, not a fine.</text>
</svg>
