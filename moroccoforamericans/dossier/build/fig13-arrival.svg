<svg viewBox="0 0 1300 640" xmlns="http://www.w3.org/2000/svg">
<rect width="1300" height="640" fill="#f5efe2"/>
<text x="650.0" y="30.0" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="22.9" letter-spacing="4.21" fill="#9c6b3f">THE FIRST THREE HOURS · DECIDED NOW, OR DECIDED TIRED</text>
<line x1="96.0" y1="150.0" x2="1204.0" y2="150.0" stroke="#9c6b3f" stroke-width="3.06"/>
<circle cx="234.5" cy="150.0" r="13.4" fill="#16614f"/>
<text x="234.5" y="104.1" text-anchor="middle" font-family="Georgia,serif" font-size="24.9" font-weight="600" fill="#241a12">Landing</text>
<text x="118.0" y="257.1" font-family="Georgia,serif" font-size="22.0" fill="#16614f">An eSIM, bought before</text>
<text x="118.0" y="288.9" font-family="Georgia,serif" font-size="22.0" fill="#16614f">you left home</text>
<text x="118.0" y="486.5" font-family="Georgia,serif" font-size="22.0" fill="#9c6b3f">Twenty minutes, your</text>
<text x="118.0" y="518.3" font-family="Georgia,serif" font-size="22.0" fill="#9c6b3f">passport, and a queue</text>
<circle cx="511.5" cy="150.0" r="13.4" fill="#16614f"/>
<text x="511.5" y="104.1" text-anchor="middle" font-family="Georgia,serif" font-size="24.9" font-weight="600" fill="#241a12">The first cash</text>
<line x1="373.0" y1="50.6" x2="373.0" y2="544.0" stroke="#d8cbb0" stroke-width="1.91"/>
<text x="395.0" y="257.1" font-family="Georgia,serif" font-size="22.0" fill="#16614f">A bank ATM in the</text>
<text x="395.0" y="288.9" font-family="Georgia,serif" font-size="22.0" fill="#16614f">arrivals hall</text>
<text x="395.0" y="486.5" font-family="Georgia,serif" font-size="22.0" fill="#9c6b3f">A kiosk, and “charge</text>
<text x="395.0" y="518.3" font-family="Georgia,serif" font-size="22.0" fill="#9c6b3f">in dollars” accepted</text>
<circle cx="788.5" cy="150.0" r="13.4" fill="#16614f"/>
<text x="788.5" y="104.1" text-anchor="middle" font-family="Georgia,serif" font-size="24.9" font-weight="600" fill="#241a12">The ride in</text>
<line x1="650.0" y1="50.6" x2="650.0" y2="544.0" stroke="#d8cbb0" stroke-width="1.91"/>
<text x="672.0" y="257.1" font-family="Georgia,serif" font-size="22.0" fill="#16614f">A transfer your riad</text>
<text x="672.0" y="288.9" font-family="Georgia,serif" font-size="22.0" fill="#16614f">arranged, price agreed</text>
<text x="672.0" y="486.5" font-family="Georgia,serif" font-size="22.0" fill="#9c6b3f">A fare haggled while</text>
<text x="672.0" y="518.3" font-family="Georgia,serif" font-size="22.0" fill="#9c6b3f">holding your luggage</text>
<circle cx="1065.5" cy="150.0" r="13.4" fill="#16614f"/>
<text x="1065.5" y="104.1" text-anchor="middle" font-family="Georgia,serif" font-size="24.9" font-weight="600" fill="#241a12">The last lane</text>
<line x1="927.0" y1="50.6" x2="927.0" y2="544.0" stroke="#d8cbb0" stroke-width="1.91"/>
<text x="949.0" y="257.1" font-family="Georgia,serif" font-size="22.0" fill="#16614f">Someone meets you and</text>
<text x="949.0" y="288.9" font-family="Georgia,serif" font-size="22.0" fill="#16614f">walks you in</text>
<text x="949.0" y="486.5" font-family="Georgia,serif" font-size="22.0" fill="#9c6b3f">A car that cannot</text>
<text x="949.0" y="518.3" font-family="Georgia,serif" font-size="22.0" fill="#9c6b3f">reach the door</text>
<text x="96.0" y="207.4" font-family="'IBM Plex Mono',monospace" font-size="19.1" letter-spacing="2.68" fill="#16614f">DECIDED NOW</text>
<text x="96.0" y="436.8" font-family="'IBM Plex Mono',monospace" font-size="19.1" letter-spacing="2.68" fill="#9c6b3f">DECIDED TIRED</text>
<line x1="90.0" y1="564.0" x2="1210.0" y2="564.0" stroke="#9c6b3f" stroke-width="2.68"/>
<text x="90.0" y="596.0" font-family="Georgia,serif" font-size="23.9" fill="#9c6b3f">The web works on people solving four problems at once with luggage in their hands.</text>
<text x="90.0" y="622.0" font-family="Georgia,serif" font-size="21.0" fill="#8a7a5f">Every answer on the top row can be settled weeks earlier, from your sofa.</text>
</svg>
