<text x="590.0" y="536.0" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="22.9" letter-spacing="1.53" fill="#c8912f">9–10 H</text>
<text x="70.0" y="560.0" font-family="Georgia,serif" font-size="23.9" fill="#8a7a5f">Erg Chebbi. 150 m dunes. One night there, not two.</text>
<text x="670.0" y="536.0" font-family="Georgia,serif" font-size="30.6" font-weight="600" fill="#241a12">Zagora</text>
<text x="1190.0" y="536.0" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="22.9" letter-spacing="1.53" fill="#16614f">6–7 H</text>
<text x="670.0" y="560.0" font-family="Georgia,serif" font-size="23.9" fill="#8a7a5f">Rocky hammada. Nearer, and the dunes are modest.</text>
<line x1="70.0" y1="586.0" x2="1230.0" y2="586.0" stroke="#d8cbb0" stroke-width="2.68"/>
<text x="70.0" y="612.0" font-family="Georgia,serif" font-size="23.9" fill="#9c6b3f">The drive is not the cost of the trip — it is the trip. Budget it as a day, in both directions.</text>
