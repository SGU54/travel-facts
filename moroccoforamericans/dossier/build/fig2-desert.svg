<text x="1230.0" y="476.0" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="17.2" fill="#8a7a5f">TRUE SCALE · DRIVE HOURS ARE HONEST ESTIMATES</text>
<line x1="70.0" y1="502.0" x2="1230.0" y2="502.0" stroke="#9c6b3f" stroke-width="2.68"/>
