<svg viewBox="0 0 1300 640" xmlns="http://www.w3.org/2000/svg">
<rect width="1300" height="640" fill="#f5efe2"/>
<text x="650.0" y="30.0" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="22.9" letter-spacing="4.21" fill="#9c6b3f">THE ONE MORE THING · WHERE EACH OPTION SITS</text>
<path d="M 232.9 493.0 L 594.0 549.7 L 504.6 235.2" fill="none" stroke="#d8cbb0" stroke-width="7" stroke-linecap="round"/>
<text x="354.8" y="364.1" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="19.1" letter-spacing="2.68" fill="#8a7a5f">THE CLASSIC LOOP</text>
<circle cx="232.9" cy="493.0" r="11.5" fill="#16614f"/>
<text x="232.9" y="468.1" text-anchor="middle" font-family="Georgia,serif" font-size="23.9" font-weight="600" fill="#241a12">Marrakech</text>
<circle cx="594.0" cy="549.7" r="11.5" fill="#16614f"/>
<text x="594.0" y="524.8" text-anchor="middle" font-family="Georgia,serif" font-size="23.9" font-weight="600" fill="#241a12">Merzouga</text>
<circle cx="504.6" cy="235.2" r="11.5" fill="#16614f"/>
<text x="504.6" y="210.3" text-anchor="middle" font-family="Georgia,serif" font-size="23.9" font-weight="600" fill="#241a12">Fez</text>
<circle cx="480.2" cy="114.3" r="11.5" fill="#c8912f"/>
<text x="480.2" y="100.3" text-anchor="middle" font-family="Georgia,serif" font-size="23.9" font-weight="600" fill="#241a12">Chefchaouen</text>
<circle cx="74.0" cy="505.8" r="11.5" fill="#c8912f"/>
<text x="70.0" y="527.8" font-family="Georgia,serif" font-size="23.9" font-weight="600" fill="#241a12">Essaouira</text>
<circle cx="241.0" cy="545.4" r="11.5" fill="#c8912f"/>
<text x="241.0" y="567.4" text-anchor="middle" font-family="Georgia,serif" font-size="23.9" font-weight="600" fill="#241a12">High Atlas</text>
<text x="74.0" y="626.0" font-family="'IBM Plex Mono',monospace" font-size="17.2" fill="#8a7a5f">TRUE SCALE · COS(LAT) CORRECTED</text>
<text x="680.0" y="100.0" font-family="'IBM Plex Mono',monospace" font-size="19.1" letter-spacing="3.44" fill="#9c6b3f">WHAT EACH ONE COSTS THE LOOP</text>
<line x1="680.0" y1="124.9" x2="1240.0" y2="124.9" stroke="#9c6b3f" stroke-width="2.68"/>
<text x="680.0" y="187.9" font-family="Georgia,serif" font-size="24.9" font-weight="600" fill="#241a12">Chefchaouen</text>
<text x="1240.0" y="187.9" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="19.1" letter-spacing="1.15" fill="#16614f">+1 NIGHT</text>
<text x="680.0" y="220.4" font-family="Georgia,serif" font-size="21.0" fill="#8a7a5f">4 h by road from Fez, and back the same way.</text>
<line x1="680.0" y1="245.3" x2="1240.0" y2="245.3" stroke="#d8cbb0" stroke-width="1.91"/>
<text x="680.0" y="274.0" font-family="Georgia,serif" font-size="24.9" font-weight="600" fill="#241a12">Essaouira</text>
<text x="1240.0" y="274.0" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="19.1" letter-spacing="1.15" fill="#16614f">+0 NIGHTS</text>
<text x="680.0" y="306.5" font-family="Georgia,serif" font-size="21.0" fill="#8a7a5f">A day trip from Marrakech — long enough each way that it uses a full day of the itinerary.</text>
<line x1="680.0" y1="331.3" x2="1240.0" y2="331.3" stroke="#d8cbb0" stroke-width="1.91"/>
<text x="680.0" y="360.0" font-family="Georgia,serif" font-size="24.9" font-weight="600" fill="#241a12">High Atlas</text>
<text x="1240.0" y="360.0" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="19.1" letter-spacing="1.15" fill="#16614f">+0 NIGHTS</text>
<text x="680.0" y="392.5" font-family="Georgia,serif" font-size="21.0" fill="#8a7a5f">A day trip from Marrakech. Same as above.</text>
<line x1="680.0" y1="417.4" x2="1240.0" y2="417.4" stroke="#d8cbb0" stroke-width="1.91"/>
<text x="680.0" y="453.7" font-family="Georgia,serif" font-size="20.1" fill="#9c6b3f">Only one of the three actually spends a night of the trip.</text>
