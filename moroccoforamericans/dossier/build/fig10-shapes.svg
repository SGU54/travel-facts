<svg viewBox="0 0 1300 640" xmlns="http://www.w3.org/2000/svg">
<rect width="1300" height="640" fill="#f5efe2"/>
<text x="650.0" y="30.0" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="22.9" letter-spacing="4.21" fill="#9c6b3f">THREE SHAPES · ONLY ONE NEVER REPEATS A LEG</text>
<text x="150.0" y="82.3" font-family="Georgia,serif" font-size="25.8" font-weight="600" fill="#241a12">Marrakech only</text>
<line x1="150.0" y1="132.0" x2="150.0" y2="132.0" stroke="#16614f" stroke-width="4.59"/>
<circle cx="150.0" cy="132.0" r="11.5" fill="#16614f"/>
<text x="150.0" y="174.1" text-anchor="middle" font-family="Georgia,serif" font-size="21.0" fill="#8a7a5f">Marrakech</text>
<text x="1150.0" y="82.3" text-anchor="end" font-family="Georgia,serif" font-size="21.0" fill="#8a7a5f">One city and one Atlas day trip. No desert, no second city.</text>
<text x="150.0" y="238.3" font-family="Georgia,serif" font-size="25.8" font-weight="600" fill="#241a12">Marrakech in, Fez out</text>
<line x1="150.0" y1="288.0" x2="1150.0" y2="288.0" stroke="#16614f" stroke-width="4.59"/>
<circle cx="150.0" cy="288.0" r="11.5" fill="#16614f"/>
<text x="150.0" y="330.1" text-anchor="middle" font-family="Georgia,serif" font-size="21.0" fill="#8a7a5f">Marrakech</text>
<circle cx="670.0" cy="288.0" r="11.5" fill="#16614f"/>
<text x="670.0" y="330.1" text-anchor="middle" font-family="Georgia,serif" font-size="21.0" fill="#8a7a5f">Desert</text>
<circle cx="1150.0" cy="288.0" r="11.5" fill="#16614f"/>
<text x="1150.0" y="330.1" text-anchor="middle" font-family="Georgia,serif" font-size="21.0" fill="#8a7a5f">Fez</text>
<text x="1150.0" y="238.3" text-anchor="end" font-family="Georgia,serif" font-size="21.0" fill="#8a7a5f">You pack once and keep moving forward. Nothing is driven twice.</text>
<text x="150.0" y="394.3" font-family="Georgia,serif" font-size="25.8" font-weight="600" fill="#241a12">One fixed base</text>
<line x1="150.0" y1="444.0" x2="670.0" y2="444.0" stroke="#9c6b3f" stroke-width="4.59"/>
<circle cx="150.0" cy="444.0" r="11.5" fill="#9c6b3f"/>
<text x="150.0" y="486.1" text-anchor="middle" font-family="Georgia,serif" font-size="21.0" fill="#8a7a5f">Marrakech</text>
<circle cx="670.0" cy="444.0" r="11.5" fill="#9c6b3f"/>
<text x="670.0" y="486.1" text-anchor="middle" font-family="Georgia,serif" font-size="21.0" fill="#8a7a5f">Desert</text>
<path d="M 670.0 421.1 Q 410.0 356.1 150.0 421.1" fill="none" stroke="#9c6b3f" stroke-width="4.21" stroke-dasharray="5.7 9.6"/>
<text x="410.0" y="348.4" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="20.1" letter-spacing="1.53" fill="#9c6b3f">DRIVEN BACK</text>
<text x="1150.0" y="394.3" text-anchor="end" font-family="Georgia,serif" font-size="21.0" fill="#8a7a5f">The desert road, out and back. That return leg is a day.</text>
<line x1="90.0" y1="578.0" x2="1210.0" y2="578.0" stroke="#9c6b3f" stroke-width="2.68"/>
<text x="90.0" y="608.0" font-family="Georgia,serif" font-size="23.9" fill="#9c6b3f">The base question is really: which city do you end in? That is the one the open-jaw ticket turns on.</text>
</svg>
