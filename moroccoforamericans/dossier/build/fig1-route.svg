<svg viewBox="0 0 1300 640" xmlns="http://www.w3.org/2000/svg">
<rect width="1300" height="640" fill="#f5efe2"/>
<text x="650.0" y="30.0" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="22.9" letter-spacing="4.21" fill="#9c6b3f">THE OPEN-JAW LINE · FLY INTO ONE CITY, OUT OF ANOTHER</text>
<path d="M 107.9 462.7 L 470.1 520.0 L 380.5 202.2" fill="none" stroke="#9c6b3f" stroke-width="2.6" stroke-dasharray="1 7" stroke-linecap="round"/>
<path d="M 107.9 462.7 L 380.5 202.2" fill="none" stroke="#d8cbb0" stroke-width="1.4" stroke-dasharray="5 6"/>
<circle cx="145.9" cy="253.0" r="5.7" fill="#d8cbb0"/>
<text x="145.9" y="235.8" text-anchor="middle" font-family="Georgia,serif" font-size="19.1" fill="#8a7a5f">Casablanca</text>
<circle cx="356.0" cy="80.0" r="5.7" fill="#d8cbb0"/>
<text x="356.0" y="62.8" text-anchor="middle" font-family="Georgia,serif" font-size="19.1" fill="#8a7a5f">Chefchaouen</text>
<circle cx="107.9" cy="462.7" r="13.4" fill="#16614f"/>
<text x="107.9" y="435.9" text-anchor="middle" font-family="Georgia,serif" font-size="26.8" font-weight="600" fill="#241a12">Marrakech</text>
<text x="107.9" y="413.0" text-anchor="middle" font-family="Georgia,serif" font-size="17.2" fill="#9c6b3f">ARRIVE · RAK</text>
<circle cx="470.1" cy="520.0" r="13.4" fill="#c8912f"/>
<text x="470.1" y="562.1" text-anchor="middle" font-family="Georgia,serif" font-size="26.8" font-weight="600" fill="#241a12">Merzouga</text>
<text x="470.1" y="585.0" text-anchor="middle" font-family="Georgia,serif" font-size="17.2" fill="#9c6b3f">THE DESERT NIGHT</text>
<circle cx="380.5" cy="202.2" r="13.4" fill="#16614f"/>
<text x="380.5" y="175.4" text-anchor="middle" font-family="Georgia,serif" font-size="26.8" font-weight="600" fill="#241a12">Fez</text>
<text x="380.5" y="152.5" text-anchor="middle" font-family="Georgia,serif" font-size="17.2" fill="#9c6b3f">DEPART · FEZ</text>
<text x="74.0" y="626.0" font-family="'IBM Plex Mono',monospace" font-size="17.2" fill="#8a7a5f">TRUE SCALE · COS(LAT) CORRECTED</text>
<text x="600.0" y="96.0" font-family="'IBM Plex Mono',monospace" font-size="19.1" letter-spacing="3.44" fill="#9c6b3f">WHAT THE OPEN JAW BUYS</text>
<line x1="600.0" y1="120.9" x2="1240.0" y2="120.9" stroke="#9c6b3f" stroke-width="2.68"/>
<text x="600.0" y="183.9" font-family="Georgia,serif" font-size="24.9" font-weight="600" fill="#241a12">Marrakech → Merzouga → Fez</text>
<text x="1240.0" y="183.9" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="19.1" letter-spacing="1.15" fill="#16614f">~1,030 KM</text>
<text x="600.0" y="216.4" font-family="Georgia,serif" font-size="21.0" fill="#8a7a5f">One direction. Every night is somewhere you have not slept.</text>
<line x1="600.0" y1="241.3" x2="1240.0" y2="241.3" stroke="#d8cbb0" stroke-width="1.91"/>
<text x="600.0" y="270.0" font-family="Georgia,serif" font-size="24.9" font-weight="600" fill="#241a12">Flying home from Marrakech instead</text>
<text x="1240.0" y="270.0" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="19.1" letter-spacing="1.15" fill="#16614f">~1,560 KM</text>
<text x="600.0" y="302.5" font-family="Georgia,serif" font-size="21.0" fill="#8a7a5f">Fez → Marrakech adds a leg you have effectively already driven.</text>
<line x1="600.0" y1="327.3" x2="1240.0" y2="327.3" stroke="#d8cbb0" stroke-width="1.91"/>
<text x="600.0" y="356.0" font-family="Georgia,serif" font-size="24.9" font-weight="600" fill="#241a12">What the open jaw removes</text>
<text x="1240.0" y="356.0" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="19.1" letter-spacing="1.15" fill="#16614f">6–7 H</text>
<text x="600.0" y="388.5" font-family="Georgia,serif" font-size="21.0" fill="#8a7a5f">One driving day, and the night at the end of it.</text>
<line x1="600.0" y1="413.4" x2="1240.0" y2="413.4" stroke="#d8cbb0" stroke-width="1.91"/>
<text x="600.0" y="449.7" font-family="Georgia,serif" font-size="20.1" fill="#9c6b3f">Ask for it by name: an open-jaw fare — one ticket, two cities, usually cheaper than two one-ways.</text>
</svg>
