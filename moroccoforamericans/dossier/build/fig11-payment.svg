<svg viewBox="0 0 1300 640" xmlns="http://www.w3.org/2000/svg">
<rect width="1300" height="640" fill="#f5efe2"/>
<text x="650.0" y="30.0" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="22.9" letter-spacing="4.21" fill="#9c6b3f">FOLLOW THE MONEY, NOT THE BADGE ALONE</text>
<text x="90.0" y="60.6" font-family="Georgia,serif" font-size="26.8" font-weight="600" fill="#241a12">The licensed guide</text>
<rect x="90.0" y="110.3" width="477.9" height="99.4" fill="none" stroke="#16614f" stroke-width="2.68"/>
<text x="329.0" y="152.4" text-anchor="middle" font-family="Georgia,serif" font-size="23.9" font-weight="600" fill="#241a12">You</text>
<text x="329.0" y="186.8" text-anchor="middle" font-family="Georgia,serif" font-size="20.1" fill="#8a7a5f">pay a rate agreed in advance</text>
<line x1="577.9" y1="160.0" x2="714.0" y2="160.0" stroke="#16614f" stroke-width="4.59"/>
<path d="M 714.0 146.6 L 736.0 160.0 L 714.0 173.4 Z" fill="#16614f"/>
<rect x="740.0" y="110.3" width="477.9" height="99.4" fill="none" stroke="#16614f" stroke-width="2.68"/>
<text x="979.0" y="152.4" text-anchor="middle" font-family="Georgia,serif" font-size="23.9" font-weight="600" fill="#241a12">The guide</text>
<text x="979.0" y="186.8" text-anchor="middle" font-family="Georgia,serif" font-size="20.1" fill="#8a7a5f">works for whoever paid him</text>
<text x="90.0" y="270.9" font-family="Georgia,serif" font-size="22.0" fill="#16614f">So his interest is showing you the city well — that is the transaction you bought.</text>
<text x="90.0" y="300.6" font-family="Georgia,serif" font-size="26.8" font-weight="600" fill="#241a12">The faux guide</text>
<rect x="90.0" y="350.3" width="477.9" height="99.4" fill="none" stroke="#9c6b3f" stroke-width="2.68"/>
<text x="329.0" y="392.4" text-anchor="middle" font-family="Georgia,serif" font-size="23.9" font-weight="600" fill="#241a12">The shop</text>
<text x="329.0" y="426.8" text-anchor="middle" font-family="Georgia,serif" font-size="20.1" fill="#8a7a5f">pays a commission on what you buy</text>
<line x1="577.9" y1="400.0" x2="714.0" y2="400.0" stroke="#9c6b3f" stroke-width="4.59"/>
<path d="M 714.0 386.6 L 736.0 400.0 L 714.0 413.4 Z" fill="#9c6b3f"/>
<rect x="740.0" y="350.3" width="477.9" height="99.4" fill="none" stroke="#9c6b3f" stroke-width="2.68"/>
<text x="979.0" y="392.4" text-anchor="middle" font-family="Georgia,serif" font-size="23.9" font-weight="600" fill="#241a12">The guide</text>
<text x="979.0" y="426.8" text-anchor="middle" font-family="Georgia,serif" font-size="20.1" fill="#8a7a5f">works for whoever paid him</text>
<text x="90.0" y="510.9" font-family="Georgia,serif" font-size="22.0" fill="#9c6b3f">So his interest is delivering you to the shop, not showing you anything at all.</text>
<line x1="90.0" y1="564.0" x2="1210.0" y2="564.0" stroke="#9c6b3f" stroke-width="2.68"/>
<text x="90.0" y="596.0" font-family="Georgia,serif" font-size="23.9" fill="#9c6b3f">Both men know the city. Only one of them is paid by you, and that is the entire difference.</text>
<text x="90.0" y="622.0" font-family="Georgia,serif" font-size="21.0" fill="#8a7a5f">Ask to see the badge. A genuine guide shows it without hesitating.</text>
</svg>
