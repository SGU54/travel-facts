<svg viewBox="0 0 1300 640" xmlns="http://www.w3.org/2000/svg">
<rect width="1300" height="640" fill="#f5efe2"/>
<text x="650.0" y="30.0" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="22.9" letter-spacing="4.21" fill="#9c6b3f">THREE TOOLS, THREE JOBS · NOT INTERCHANGEABLE</text>
<line x1="70.0" y1="98.0" x2="1230.0" y2="98.0" stroke="#d8cbb0" stroke-width="2.68"/>
<rect x="70.0" y="112.0" width="5.0" height="62.0" fill="#16614f"/>
<text x="92.0" y="128.0" font-family="Georgia,serif" font-size="29.6" font-weight="600" fill="#241a12">ONCF train</text>
<text x="92.0" y="151.0" font-family="'IBM Plex Mono',monospace" font-size="21.0" letter-spacing="1.34" fill="#16614f">CASABLANCA · RABAT · FEZ · MARRAKECH · TANGIER</text>
<text x="92.0" y="174.0" font-family="Georgia,serif" font-size="23.9" fill="#8a7a5f">The calm spine — but it stops where the rail line stops.</text>
<line x1="70.0" y1="258.0" x2="1230.0" y2="258.0" stroke="#d8cbb0" stroke-width="2.68"/>
<rect x="70.0" y="272.0" width="5.0" height="62.0" fill="#c8912f"/>
<text x="92.0" y="288.0" font-family="Georgia,serif" font-size="29.6" font-weight="600" fill="#241a12">CTM / Supratours coach</text>
<text x="92.0" y="311.0" font-family="'IBM Plex Mono',monospace" font-size="21.0" letter-spacing="1.34" fill="#c8912f">CHEFCHAOUEN · ESSAOUIRA · THE OFF-RAIL TOWNS</text>
<text x="92.0" y="334.0" font-family="Georgia,serif" font-size="23.9" fill="#8a7a5f">Fills the gaps. Small luggage fee, paid at the station.</text>
<line x1="70.0" y1="418.0" x2="1230.0" y2="418.0" stroke="#d8cbb0" stroke-width="2.68"/>
<rect x="70.0" y="432.0" width="5.0" height="62.0" fill="#9c6b3f"/>
<text x="92.0" y="448.0" font-family="Georgia,serif" font-size="29.6" font-weight="600" fill="#241a12">Private driver</text>
<text x="92.0" y="471.0" font-family="'IBM Plex Mono',monospace" font-size="21.0" letter-spacing="1.34" fill="#9c6b3f">THE DESERT LOOP · THE OPEN JAW</text>
<text x="92.0" y="494.0" font-family="Georgia,serif" font-size="23.9" fill="#8a7a5f">Content, not transit — priciest, and right exactly once.</text>
<line x1="70.0" y1="578.0" x2="1230.0" y2="578.0" stroke="#9c6b3f" stroke-width="2.68"/>
<text x="70.0" y="608.0" font-family="Georgia,serif" font-size="23.9" fill="#9c6b3f">Match the tool to the leg. Force one tool onto every leg and one of them costs you a day.</text>
</svg>
