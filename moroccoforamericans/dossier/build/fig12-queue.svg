<svg viewBox="0 0 1300 640" xmlns="http://www.w3.org/2000/svg">
<rect width="1300" height="640" fill="#f5efe2"/>
<text x="650.0" y="30.0" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="22.9" letter-spacing="4.21" fill="#9c6b3f">THE QUEUE IS A REVIEW THAT CANNOT BE BOUGHT</text>
<rect x="430.0" y="110.0" width="440.0" height="360.0" fill="none" stroke="#d8cbb0" stroke-width="2.29"/>
