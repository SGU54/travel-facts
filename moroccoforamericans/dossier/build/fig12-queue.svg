<line x1="430.0" y1="290.0" x2="870.0" y2="290.0" stroke="#d8cbb0" stroke-width="1.91"/>
<text x="650.0" y="71.8" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="20.1" letter-spacing="2.68" fill="#8a7a5f">HIGH TURNOVER</text>
<text x="650.0" y="531.2" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="20.1" letter-spacing="2.68" fill="#8a7a5f">THE FOOD SITS</text>
<text x="380.3" y="290.0" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="20.1" letter-spacing="2.68" fill="#8a7a5f">THE MENU FACES LOCALS</text>
<text x="919.7" y="290.0" font-family="'IBM Plex Mono',monospace" font-size="20.1" letter-spacing="2.68" fill="#8a7a5f">THE MENU FACES VISITORS</text>
<circle cx="760.0" cy="200.0" r="17.2" fill="#16614f"/>
<line x1="784.9" y1="200.0" x2="966.5" y2="200.0" stroke="#16614f" stroke-width="1.91" stroke-dasharray="5.7 7.6"/>
<text x="985.6" y="194.3" font-family="Georgia,serif" font-size="23.9" font-weight="600" fill="#241a12">The busy local stall</text>
<text x="985.6" y="228.7" font-family="Georgia,serif" font-size="20.1" fill="#8a7a5f">Answers both worries at once</text>
<circle cx="540.0" cy="200.0" r="11.5" fill="#c8912f"/>
<line x1="520.9" y1="200.0" x2="333.5" y2="200.0" stroke="#c8912f" stroke-width="1.91" stroke-dasharray="5.7 7.6"/>
<text x="314.4" y="194.3" text-anchor="end" font-family="Georgia,serif" font-size="23.9" font-weight="600" fill="#241a12">The quiet local place</text>
<text x="314.4" y="228.7" text-anchor="end" font-family="Georgia,serif" font-size="20.1" fill="#8a7a5f">Fair value; the food has waited</text>
<circle cx="760.0" cy="380.0" r="11.5" fill="#9c6b3f"/>
<line x1="779.1" y1="380.0" x2="966.5" y2="380.0" stroke="#9c6b3f" stroke-width="1.91" stroke-dasharray="5.7 7.6"/>
<text x="985.6" y="374.3" font-family="Georgia,serif" font-size="23.9" font-weight="600" fill="#241a12">The main-square terrace</text>
<text x="985.6" y="408.7" font-family="Georgia,serif" font-size="20.1" fill="#8a7a5f">Busy — priced for people passing</text>
<circle cx="540.0" cy="380.0" r="11.5" fill="#9c6b3f"/>
<line x1="520.9" y1="380.0" x2="333.5" y2="380.0" stroke="#9c6b3f" stroke-width="1.91" stroke-dasharray="5.7 7.6"/>
<text x="314.4" y="374.3" text-anchor="end" font-family="Georgia,serif" font-size="23.9" font-weight="600" fill="#241a12">The “cooperative”</text>
<text x="314.4" y="408.7" text-anchor="end" font-family="Georgia,serif" font-size="20.1" fill="#8a7a5f">Someone is paid to bring you</text>
<line x1="90.0" y1="578.0" x2="1210.0" y2="578.0" stroke="#9c6b3f" stroke-width="2.68"/>
<text x="90.0" y="608.0" font-family="Georgia,serif" font-size="23.9" fill="#9c6b3f">One quadrant settles hygiene and value with the same observation. Look for the line.</text>
