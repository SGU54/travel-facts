<svg viewBox="0 0 1300 640" xmlns="http://www.w3.org/2000/svg">
<rect width="1300" height="640" fill="#f5efe2"/>
<text x="650.0" y="30.0" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="22.9" letter-spacing="4.21" fill="#9c6b3f">FOUR HABITS · ALL OF THEM COST NOTHING</text>
<rect x="330.0" y="112.0" width="640.0" height="362.0" fill="none" stroke="#d8cbb0" stroke-width="2.29"/>
<line x1="543.3" y1="112.0" x2="543.3" y2="474.0" stroke="#d8cbb0" stroke-width="1.91"/>
<line x1="330.0" y1="232.7" x2="970.0" y2="232.7" stroke="#d8cbb0" stroke-width="1.91"/>
<line x1="756.7" y1="112.0" x2="756.7" y2="474.0" stroke="#d8cbb0" stroke-width="1.91"/>
<line x1="330.0" y1="353.3" x2="970.0" y2="353.3" stroke="#d8cbb0" stroke-width="1.91"/>
<rect x="330.0" y="112.0" width="213.3" height="120.7" fill="#16614f" opacity="0.07"/>
<text x="330.0" y="73.8" font-family="'IBM Plex Mono',monospace" font-size="20.1" letter-spacing="2.68" fill="#8a7a5f">COSTS YOU NOTHING</text>
<text x="970.0" y="73.8" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="20.1" letter-spacing="2.68" fill="#8a7a5f">COSTS YOU EFFORT</text>
<text x="284.1" y="127.3" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="20.1" letter-spacing="2.68" fill="#8a7a5f">NOTICED</text>
<text x="284.1" y="474.0" text-anchor="end" font-family="'IBM Plex Mono',monospace" font-size="20.1" letter-spacing="2.68" fill="#8a7a5f">UNNOTICED</text>
<circle cx="381.2" cy="137.3" r="13.4" fill="#16614f"/>
<text x="415.6" y="131.6" font-family="Georgia,serif" font-size="23.9" font-weight="600" fill="#241a12">Dress modestly</text>
<text x="415.6" y="164.1" font-family="Georgia,serif" font-size="20.1" fill="#8a7a5f">shoulders and knees, looser not tighter</text>
<circle cx="445.2" cy="220.6" r="13.4" fill="#16614f"/>
<text x="479.6" y="214.9" font-family="Georgia,serif" font-size="23.9" font-weight="600" fill="#241a12">Carry a light scarf</text>
<text x="479.6" y="247.4" font-family="Georgia,serif" font-size="20.1" fill="#8a7a5f">one outfit, two contexts</text>
<circle cx="368.4" cy="303.9" r="13.4" fill="#16614f"/>
<text x="402.8" y="298.1" font-family="Georgia,serif" font-size="23.9" font-weight="600" fill="#241a12">Right hand to eat and give</text>
<text x="402.8" y="330.6" font-family="Georgia,serif" font-size="20.1" fill="#8a7a5f">nobody corrects you — which is why it lands</text>
<circle cx="458.0" cy="387.1" r="13.4" fill="#16614f"/>
<text x="492.4" y="381.4" font-family="Georgia,serif" font-size="23.9" font-weight="600" fill="#241a12">Ask before photographing</text>
<text x="492.4" y="413.9" font-family="Georgia,serif" font-size="20.1" fill="#8a7a5f">in a market a camera is a transaction</text>
<circle cx="778.0" cy="437.8" r="13.4" fill="#9c6b3f"/>
<text x="812.4" y="432.1" font-family="Georgia,serif" font-size="23.9" font-weight="600" fill="#241a12">Dressing as a costume</text>
<text x="812.4" y="464.6" font-family="Georgia,serif" font-size="20.1" fill="#9c6b3f">nobody asked for this</text>
<line x1="90.0" y1="578.0" x2="1210.0" y2="578.0" stroke="#9c6b3f" stroke-width="2.68"/>
<text x="90.0" y="608.0" font-family="Georgia,serif" font-size="23.9" fill="#9c6b3f">Every habit worth having sits in one corner: free, and noticed. The aim is respect, not performance.</text>
</svg>
