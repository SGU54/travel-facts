<svg viewBox="0 0 1300 640" xmlns="http://www.w3.org/2000/svg">
<rect width="1300" height="640" fill="#f5efe2"/>
<text x="650.0" y="30.0" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="22.9" letter-spacing="4.21" fill="#9c6b3f">WHAT MOROCCO ASKS OF AN AMERICAN PASSPORT</text>
<text x="90.0" y="96.0" font-family="'IBM Plex Mono',monospace" font-size="20.1" letter-spacing="3.44" fill="#16614f">REQUIRED</text>
<line x1="90.0" y1="110.0" x2="610.0" y2="110.0" stroke="#16614f" stroke-width="3.06"/>
<text x="90.0" y="164.0" font-family="Georgia,serif" font-size="24.9" font-weight="600" fill="#241a12">A valid passport</text>
<text x="90.0" y="198.4" font-family="Georgia,serif" font-size="20.1" fill="#8a7a5f">that is the whole legal test</text>
<line x1="90.0" y1="229.0" x2="610.0" y2="229.0" stroke="#d8cbb0" stroke-width="1.91"/>
<text x="90.0" y="271.1" font-family="Georgia,serif" font-size="24.9" font-weight="600" fill="#241a12">Nothing else at the border</text>
<text x="90.0" y="305.5" font-family="Georgia,serif" font-size="20.1" fill="#8a7a5f">no visa, no application, no fee</text>
<line x1="90.0" y1="336.1" x2="610.0" y2="336.1" stroke="#d8cbb0" stroke-width="1.91"/>
<text x="90.0" y="378.1" font-family="Georgia,serif" font-size="24.9" font-weight="600" fill="#241a12">Nothing paid on arrival</text>
<text x="90.0" y="412.5" font-family="Georgia,serif" font-size="20.1" fill="#8a7a5f">admission up to 90 days, stamped</text>
<line x1="90.0" y1="443.1" x2="610.0" y2="443.1" stroke="#d8cbb0" stroke-width="1.91"/>
<text x="690.0" y="96.0" font-family="'IBM Plex Mono',monospace" font-size="20.1" letter-spacing="3.44" fill="#7d8ba3">NOT REQUIRED</text>
<line x1="690.0" y1="110.0" x2="1210.0" y2="110.0" stroke="#7d8ba3" stroke-width="3.06"/>
<text x="690.0" y="164.0" font-family="Georgia,serif" font-size="24.9" font-weight="600" fill="#241a12">An AEVM authorisation</text>
<text x="690.0" y="198.4" font-family="Georgia,serif" font-size="20.1" fill="#8a7a5f">exists — not for US, UK or EU travellers</text>
<line x1="690.0" y1="229.0" x2="1210.0" y2="229.0" stroke="#d8cbb0" stroke-width="1.91"/>
<text x="690.0" y="271.1" font-family="Georgia,serif" font-size="24.9" font-weight="600" fill="#241a12">Any advance paperwork</text>
<text x="690.0" y="305.5" font-family="Georgia,serif" font-size="20.1" fill="#8a7a5f">which is exactly why people do none</text>
<line x1="690.0" y1="336.1" x2="1210.0" y2="336.1" stroke="#d8cbb0" stroke-width="1.91"/>
<text x="690.0" y="378.1" font-family="Georgia,serif" font-size="24.9" font-weight="600" fill="#241a12">Any deadline at all</text>
<text x="690.0" y="412.5" font-family="Georgia,serif" font-size="20.1" fill="#8a7a5f">no application means nothing to miss</text>
<line x1="690.0" y1="443.1" x2="1210.0" y2="443.1" stroke="#d8cbb0" stroke-width="1.91"/>
<rect x="90.0" y="452.0" width="1120.0" height="96.0" fill="#eee6d4" stroke="#c8912f" stroke-width="3.06"/>
<text x="114.0" y="486.0" font-family="'IBM Plex Mono',monospace" font-size="20.1" letter-spacing="3.44" fill="#c8912f">THE ONE REAL DEADLINE</text>
<text x="114.0" y="520.0" font-family="Georgia,serif" font-size="25.8" font-weight="600" fill="#241a12">Six months of passport validity — set by the airline, not by Morocco.</text>
<text x="90.0" y="618.0" font-family="Georgia,serif" font-size="22.9" fill="#9c6b3f">Because no visa forces a date, most people think about none of it. Entry is the easy part; boarding is not.</text>
</svg>
