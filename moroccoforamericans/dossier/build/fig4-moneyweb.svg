<svg viewBox="0 0 1300 640" xmlns="http://www.w3.org/2000/svg">
<rect width="1300" height="640" fill="#f5efe2"/>
<text x="650.0" y="30.0" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="22.9" letter-spacing="4.21" fill="#9c6b3f">FOUR LEAKS, ONE WEB · MOSTLY A DEFAULT, NOT A CRIME</text>
<circle cx="650.0" cy="318.0" r="99.4" fill="#eee6d4"/>
<circle cx="650.0" cy="318" r="52" fill="none" stroke="#9c6b3f" stroke-width="1.6"/>
<text x="650.0" y="314.0" text-anchor="middle" font-family="Georgia,serif" font-size="28.7" font-weight="600" fill="#241a12">Your</text>
<text x="650.0" y="334.0" text-anchor="middle" font-family="Georgia,serif" font-size="28.7" font-weight="600" fill="#241a12">money</text>
<line x1="596.0" y1="296.0" x2="404.0" y2="156.0" stroke="#c8912f" stroke-width="3.82" stroke-dasharray="1 6" stroke-linecap="round"/>
<text x="412.0" y="150.0" text-anchor="end" font-family="Georgia,serif" font-size="26.8" font-weight="600" fill="#241a12">The closed currency</text>
<text x="412.0" y="171.0" text-anchor="end" font-family="Georgia,serif" font-size="22.0" fill="#8a7a5f">the dirham is exchange-controlled</text>
<line x1="704.0" y1="296.0" x2="896.0" y2="156.0" stroke="#c8912f" stroke-width="3.82" stroke-dasharray="1 6" stroke-linecap="round"/>
<text x="888.0" y="150.0" font-family="Georgia,serif" font-size="26.8" font-weight="600" fill="#241a12">Dynamic conversion</text>
<text x="888.0" y="171.0" font-family="Georgia,serif" font-size="22.0" fill="#8a7a5f">the terminal offers dollars</text>
<line x1="596.0" y1="340.0" x2="404.0" y2="480.0" stroke="#c8912f" stroke-width="3.82" stroke-dasharray="1 6" stroke-linecap="round"/>
<text x="412.0" y="474.0" text-anchor="end" font-family="Georgia,serif" font-size="26.8" font-weight="600" fill="#241a12">The commission chain</text>
<text x="412.0" y="495.0" text-anchor="end" font-family="Georgia,serif" font-size="22.0" fill="#8a7a5f">the guide is paid by the shop</text>
<line x1="704.0" y1="340.0" x2="896.0" y2="480.0" stroke="#c8912f" stroke-width="3.82" stroke-dasharray="1 6" stroke-linecap="round"/>
<text x="888.0" y="474.0" font-family="Georgia,serif" font-size="26.8" font-weight="600" fill="#241a12">The anchor price</text>
<text x="888.0" y="495.0" font-family="Georgia,serif" font-size="22.0" fill="#8a7a5f">the first number is a test, not a tag</text>
<line x1="70.0" y1="578.0" x2="1230.0" y2="578.0" stroke="#d8cbb0" stroke-width="2.68"/>
<text x="70.0" y="604.0" font-family="Georgia,serif" font-size="23.9" fill="#9c6b3f">Most of this is a default to actively refuse, not a crime — except unlicensed guiding, which is itself outside Morocco's guide-licensing law. Refusing all four is the skill.</text>
</svg>
