<svg viewBox="0 0 620 250" xmlns="http://www.w3.org/2000/svg">
<rect width="620" height="250" fill="#F2F7F5"/>
<text x="0" y="16" fill="#A23520" font-size="8.5" font-family="Plex, monospace" letter-spacing="1.6">WHERE EACH ONE MEETS YOU — FOUR MOMENTS, FOUR MOODS, NEVER ADDED UP</text>
<line x1="46" y1="116" x2="580" y2="116" stroke="#D3DED9" stroke-width="2.5"/>
<text x="40" y="120" fill="#5B6B66" font-size="8" text-anchor="end" font-family="Plex, monospace">ARRIVE</text>
<text x="584" y="120" fill="#5B6B66" font-size="8" font-family="Plex, monospace">FLY</text>
<circle cx="78.0" cy="116" r="6.5" fill="#A23520" stroke="#0B4E70" stroke-width="1.5"/>
<line x1="78.0" y1="108" x2="78.0" y2="94" stroke="#D3DED9" stroke-width="1"/>
<text x="78.0" y="64" fill="#1B2622" font-size="10" text-anchor="middle" font-family="Public, sans-serif" font-weight="700">Airport gate</text>
<text x="78.0" y="76" fill="#5B6B66" font-size="8.5" text-anchor="middle" font-family="Public, sans-serif">the metro ticket</text>
<text x="78.0" y="87" fill="#5B6B66" font-size="8.5" text-anchor="middle" font-family="Public, sans-serif">yours doesn't cover</text>
<circle cx="227.6" cy="116" r="6.5" fill="#A23520" stroke="#0B4E70" stroke-width="1.5"/>
<line x1="227.6" y1="124" x2="227.6" y2="138" stroke="#D3DED9" stroke-width="1"/>
<text x="227.6" y="156" fill="#1B2622" font-size="10" text-anchor="middle" font-family="Public, sans-serif" font-weight="700">Any terminal</text>
<text x="227.6" y="168" fill="#5B6B66" font-size="8.5" text-anchor="middle" font-family="Public, sans-serif">“pay in dollars?”</text>
<text x="227.6" y="179" fill="#5B6B66" font-size="8.5" text-anchor="middle" font-family="Public, sans-serif">say euros — every time</text>
<circle cx="366.4" cy="116" r="6.5" fill="#A23520" stroke="#0B4E70" stroke-width="1.5"/>
<line x1="366.4" y1="108" x2="366.4" y2="94" stroke="#D3DED9" stroke-width="1"/>
<text x="366.4" y="64" fill="#1B2622" font-size="10" text-anchor="middle" font-family="Public, sans-serif" font-weight="700">The blue ATM</text>
<text x="366.4" y="76" fill="#5B6B66" font-size="8.5" text-anchor="middle" font-family="Public, sans-serif">tourist machine,</text>
<text x="366.4" y="87" fill="#5B6B66" font-size="8.5" text-anchor="middle" font-family="Public, sans-serif">layered fees</text>
<circle cx="515.9" cy="116" r="6.5" fill="#A23520" stroke="#0B4E70" stroke-width="1.5"/>
<line x1="515.9" y1="124" x2="515.9" y2="138" stroke="#D3DED9" stroke-width="1"/>
<text x="515.9" y="156" fill="#1B2622" font-size="10" text-anchor="middle" font-family="Public, sans-serif" font-weight="700">Check-out</text>
<text x="515.9" y="168" fill="#5B6B66" font-size="8.5" text-anchor="middle" font-family="Public, sans-serif">the bed tax nobody</text>
<text x="515.9" y="179" fill="#5B6B66" font-size="8.5" text-anchor="middle" font-family="Public, sans-serif">quoted you</text>
<text x="310" y="240" fill="#0E6390" font-size="9" text-anchor="middle" font-family="Public, sans-serif" font-style="italic">Each is defensible alone. The pattern is the product.</text>
</svg>