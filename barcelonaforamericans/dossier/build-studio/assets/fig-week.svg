<svg viewBox="0 0 620 200" xmlns="http://www.w3.org/2000/svg">
<rect width="620" height="200" fill="#F2F7F5"/>
<text x="0" y="16" fill="#A23520" font-size="8.5" font-family="Plex, monospace" letter-spacing="1.6">THREE ANCHORS, TWO FREE DAYS — THE SHAPE, NOT THE LIST</text>
<rect x="27.0" y="42" width="105.2" height="74" fill="#E0A828" opacity="0.85" rx="3"/>
<text x="79.6" y="61" fill="#1B2622" font-size="11" text-anchor="middle" font-family="Anton, sans-serif" letter-spacing="0.5">DAY 1</text>
<text x="79.6" y="78" fill="#1B2622" font-size="8.5" text-anchor="middle" font-family="Public, sans-serif">Sagrada, then</text>
<text x="79.6" y="90" fill="#1B2622" font-size="8.5" text-anchor="middle" font-family="Public, sans-serif">the old city</text>
<text x="79.6" y="131" fill="#A23520" font-size="7.5" text-anchor="middle" font-family="Plex, monospace" letter-spacing="0.6">BOOKED / FIXED</text>
<rect x="142.2" y="42" width="105.2" height="74" fill="#E0A828" opacity="0.85" rx="3"/>
<text x="194.8" y="61" fill="#1B2622" font-size="11" text-anchor="middle" font-family="Anton, sans-serif" letter-spacing="0.5">DAY 2</text>
<text x="194.8" y="78" fill="#1B2622" font-size="8.5" text-anchor="middle" font-family="Public, sans-serif">Park Güell,</text>
<text x="194.8" y="90" fill="#1B2622" font-size="8.5" text-anchor="middle" font-family="Public, sans-serif">then downhill</text>
<text x="194.8" y="131" fill="#A23520" font-size="7.5" text-anchor="middle" font-family="Plex, monospace" letter-spacing="0.6">BOOKED / FIXED</text>
<rect x="257.4" y="42" width="105.2" height="74" fill="#0E6390" opacity="0.2" rx="3"/>
<text x="310.0" y="61" fill="#0B4E70" font-size="11" text-anchor="middle" font-family="Anton, sans-serif" letter-spacing="0.5">DAY 3</text>
<text x="310.0" y="78" fill="#5B6B66" font-size="8.5" text-anchor="middle" font-family="Public, sans-serif">market · hill · sea</text>
<text x="310.0" y="90" fill="#5B6B66" font-size="8.5" text-anchor="middle" font-family="Public, sans-serif">absorbs overflow</text>
<text x="310.0" y="131" fill="#5B6B66" font-size="7.5" text-anchor="middle" font-family="Plex, monospace" letter-spacing="0.6">FLOATS</text>
<rect x="372.6" y="42" width="105.2" height="74" fill="#E0A828" opacity="0.85" rx="3"/>
<text x="425.2" y="61" fill="#1B2622" font-size="11" text-anchor="middle" font-family="Anton, sans-serif" letter-spacing="0.5">DAY 4</text>
<text x="425.2" y="78" fill="#1B2622" font-size="8.5" text-anchor="middle" font-family="Public, sans-serif">the day trip</text>
<text x="425.2" y="90" fill="#1B2622" font-size="8.5" text-anchor="middle" font-family="Public, sans-serif">full clear day</text>
<text x="425.2" y="131" fill="#A23520" font-size="7.5" text-anchor="middle" font-family="Plex, monospace" letter-spacing="0.6">BOOKED / FIXED</text>
<rect x="487.8" y="42" width="105.2" height="74" fill="#0E6390" opacity="0.2" rx="3"/>
<text x="540.4" y="61" fill="#0B4E70" font-size="11" text-anchor="middle" font-family="Anton, sans-serif" letter-spacing="0.5">DAY 5</text>
<text x="540.4" y="78" fill="#5B6B66" font-size="8.5" text-anchor="middle" font-family="Public, sans-serif">no agenda</text>
<text x="540.4" y="90" fill="#5B6B66" font-size="8.5" text-anchor="middle" font-family="Public, sans-serif">the city itself</text>
<text x="540.4" y="131" fill="#5B6B66" font-size="7.5" text-anchor="middle" font-family="Plex, monospace" letter-spacing="0.6">FLOATS</text>
<text x="310" y="184" fill="#0E6390" font-size="9" text-anchor="middle" font-family="Public, sans-serif" font-style="italic">The beach is never a day — it is whichever afternoon turns warm.</text>
</svg>